apiVersion: apps/v1
kind: Deployment

metadata:
  name: flask
  namespace: flask

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      labels:
        app: flask

    spec:
      containers:
      - name: flask

        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"

        imagePullPolicy: {{ .Values.image.pullPolicy }}

        args:
{{- range .Values.container.args }}
        - {{ . | quote }}
{{- end }}

        ports:
        - containerPort: {{ .Values.container.port }}

       
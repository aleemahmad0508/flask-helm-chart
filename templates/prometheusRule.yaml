apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: flask-alert-rules
  namespace: monitoring

  labels:
    release: prometheus

spec:

  groups:

  - name: flask.rules

    rules:

    - alert: FlaskApplicationDown

      expr: probe_success{job="flask-blackbox"} == 0

      for: 2m

      labels:
        severity: critical

      annotations:

        summary: "Flask application is down"

        description: "Flask application has been unreachable for more than 2 minutes."


    - alert: FlaskHighResponseTime

      expr: probe_duration_seconds{job="flask-blackbox"} > 2

      for: 2m

      labels:
        severity: warning

      annotations:

        summary: "Flask response time is high"

        description: "Flask application response time is above 2 seconds."
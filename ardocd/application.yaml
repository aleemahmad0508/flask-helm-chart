apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: flask
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/aleemahmad0508/flask-helm-chart.git
    targetRevision: master
    path: .

  destination:
    server: https://kubernetes.default.svc
    namespace: flask

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

      # kubectl port-forward svc/argocd-server -n argocd 8080:443
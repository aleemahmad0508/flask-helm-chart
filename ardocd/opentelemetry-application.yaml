apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: opentelemetry
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
    chart: opentelemetry-collector
    targetRevision: 0.130.0

    helm:
      values: |
        mode: deployment

        image:
          repository: otel/opentelemetry-collector-k8s

        config:
          receivers:
            otlp:
              protocols:
                grpc:
                http:

          processors:
            batch:

          exporters:
            debug: {}

          service:
            pipelines:
              traces:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]

              metrics:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]

              logs:
                receivers: [otlp]
                processors: [batch]
                exporters: [debug]

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
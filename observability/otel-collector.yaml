apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector

metadata:
  name: otel-collector
  namespace: observability

spec:
  mode: deployment

  ports:
    - name: otlp-grpc
      port: 4317
      protocol: TCP
      targetPort: 4317

    - name: otlp-http
      port: 4318
      protocol: TCP
      targetPort: 4318

  config:
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"

      logging:
        verbosity: detailed

    service:
      pipelines:

        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - prometheus
            - logging

        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - logging
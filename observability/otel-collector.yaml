apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-collector
  namespace: observability

spec:
  mode: deployment

  config:
    receivers:
      otlp:
        protocols:
          grpc:
          http:

    processors:
      batch:

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"

      logging:
        verbosity: detailed

    service:
      pipelines:

        metrics:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - prometheus
            - logging

        traces:
          receivers:
            - otlp
          processors:
            - batch
          exporters:
            - logging